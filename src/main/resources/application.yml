spring:
  application:
    name: church-application

#  datasource:
#    url: ${DB_URL}
#    username: ${DB_USER}
#    password: ${DB_PASSWORD}
#    driver-class-name: org.postgresql.Driver
#
#
#  jpa:
#    database: POSTGRESQL
#    show-sql: true
#    hibernate:
#      ddl-auto: update


  datasource:
    url: jdbc:h2:mem:churchdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: update


  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
    contexts: production
    enabled: false

  jwt:
    secret: ${SPRING_JWT_SECRET}

  http:
    codecs:
      max-in-memory-size: 16MB


  mail:
    host: smtp.gmail.com
    port: 587
    username: your_email@gmail.com
    password: your_app_password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000




server:
  port: 8080

# Logging
logging:
  level:
    org.springframework.jdbc.core: trace
    org.springframework.jdbc.core.simple: trace


centrifugo:
  api-url: http://localhost:8000/api
  api-key: my_api_key



aws:
  access-key: ${S3_ACCESS_KEY_ID}
  secret-key: ${S3_SECRET_ACCESS_KEY}
  region: us-east-1
  bucket-name: church-app-media



stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
